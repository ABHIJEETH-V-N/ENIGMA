<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Results</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-dark: #000805;
            --neon-cyan: #00ff41;
            --neon-magenta: #39ff14;
            --neon-green: #00ff41;
            --neon-yellow: #7fff00;
            --neon-pink: #32cd32;
            --neon-blue: #00ff7f;
            --text-bright: #e0ffe0;
            --text-dim: #334544;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--text-bright);
            overflow: hidden;
            position: relative;
        }

        /* Cyberpunk Grid Floor */
        .cyber-grid {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: 
                linear-gradient(transparent 0%, rgba(0,255,65,0.1) 100%),
                linear-gradient(90deg, rgba(0,255,65,0.05) 1px, transparent 1px),
                linear-gradient(rgba(0,255,65,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridPulse 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: float 8s linear infinite;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Chromatic aberration effect on edges */
        .aberration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            box-shadow: 
                inset 3px 0 20px rgba(255,0,128,0.1),
                inset -3px 0 20px rgba(0,255,255,0.1);
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .round-title {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 10px;
            color: var(--neon-magenta);
            text-shadow: 0 0 20px var(--neon-magenta);
            margin-bottom: 10px;
            animation: glitch 3s infinite;
        }

        .results-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 10px;
            background: linear-gradient(90deg, #00ff41, #39ff14, #00ff41);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-transform: uppercase;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: none; }
            91% { transform: skewX(5deg); }
            92% { transform: skewX(-5deg); }
            93% { transform: none; }
        }

        .subtitle {
            font-family: var(--font-mono);
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-top: 10px;
        }

        /* Clock */
        .clock {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            margin-top: 15px;
            padding: 8px 20px;
            border: 1px solid rgba(0,255,65,0.3);
            background: rgba(0,255,65,0.05);
        }

        /* Leaderboard Container */
        .leaderboard-container {
            width: 100%;
            max-width: 900px;
            perspective: 1000px;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(90deg, rgba(0,255,65,0.1), transparent, rgba(57,255,20,0.1));
            border: 1px solid rgba(0,255,65,0.3);
            margin-bottom: 5px;
        }

        .leaderboard-header span {
            font-family: var(--font-mono);
            color: var(--neon-cyan);
            font-size: 0.8rem;
            letter-spacing: 3px;
        }

        /* Player Entry */
        .player-entry {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, rgba(0,20,10,0.9), rgba(10,30,10,0.9));
            border: 1px solid rgba(0,255,65,0.2);
            border-left: 4px solid var(--neon-cyan);
            position: relative;
            overflow: hidden;
            transform: translateX(-100%);
            opacity: 0;
            animation: slideIn 0.6s ease forwards;
            transition: all 0.3s;
        }

        .player-entry:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0,255,65,0.2), inset 0 0 30px rgba(0,255,65,0.05);
            transform: scale(1.02);
        }

        .player-entry::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,65,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes slideIn {
            to { transform: translateX(0); opacity: 1; }
        }

        /* Top 3 special styling */
        .player-entry.rank-1 {
            border-left-color: #ffd700;
            background: linear-gradient(90deg, rgba(50,40,0,0.9), rgba(40,20,0,0.9));
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
        }

        .player-entry.rank-2 {
            border-left-color: #c0c0c0;
            background: linear-gradient(90deg, rgba(40,40,50,0.9), rgba(30,30,40,0.9));
        }

        .player-entry.rank-3 {
            border-left-color: #cd7f32;
            background: linear-gradient(90deg, rgba(40,25,10,0.9), rgba(30,20,10,0.9));
        }

        .rank {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            margin-right: 25px;
            position: relative;
        }

        .rank-1 .rank {
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }

        .rank-2 .rank { color: #c0c0c0; text-shadow: 0 0 15px #c0c0c0; }
        .rank-3 .rank { color: #cd7f32; text-shadow: 0 0 15px #cd7f32; }
        .rank { color: var(--neon-cyan); }

        .rank-badge {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid currentColor;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            opacity: 0.3;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .player-meta {
            font-family: var(--font-mono);
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .player-score {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan);
        }

        .rank-1 .player-score { color: #ffd700; text-shadow: 0 0 20px #ffd700; }

        /* Empty state */
        .no-results {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 1rem;
            letter-spacing: 3px;
        }

        /* Selection Badge */
        .selected-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            background: var(--neon-green);
            color: #000;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(90deg, rgba(0,255,65,0.1), rgba(0,0,0,0.9), rgba(57,255,20,0.1));
            border-top: 1px solid rgba(0,255,65,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            z-index: 100;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* User's own result highlight */
        .player-entry.is-you {
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(0,255,65,0.3);
        }

        .player-entry.is-you::after {
            content: '◀ YOU';
            position: absolute;
            right: -60px;
            font-family: var(--font-mono);
            color: var(--neon-green);
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-5px); }
        }

        /* Message from admin */
        .admin-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: var(--font-mono);
            z-index: 2000;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-50px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .results-title { font-size: 2rem; letter-spacing: 5px; }
            .player-entry { padding: 15px 20px; }
            .rank { width: 45px; height: 45px; font-size: 1.2rem; margin-right: 15px; }
            .player-name { font-size: 1rem; }
            .player-score { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>
    <div class="scanlines"></div>
    <div class="aberration"></div>

    <div class="admin-message" id="adminMessage"></div>

    <div class="main-container">
        <div class="header">
            <div class="round-title" id="roundTitle">ROUND 1 COMPLETE</div>
            <div class="results-title">LEADERBOARD</div>
            <div class="subtitle" id="subtitle">TOP PERFORMERS</div>
            <div class="clock" id="clock">00:00:00</div>
        </div>

        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <span>RANK</span>
                <span>PARTICIPANT</span>
                <span>SCORE</span>
            </div>
            <div id="leaderboard">
                <div class="no-results">AWAITING DATA TRANSMISSION...</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <div class="status-dot"></div>
            <span>LIVE RESULTS</span>
        </div>
        <div class="status-item">
            <span id="userName">PARTICIPANT</span>
        </div>
        <div class="status-item">
            <span>ENIGMA v1.0</span>
        </div>
    </div>

    <script>
    (function() {
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (5 + Math.random() * 5) + 's';
            if (Math.random() > 0.5) {
                particle.style.background = '#39ff14';
                particle.style.boxShadow = '0 0 10px #39ff14';
            }
            particlesContainer.appendChild(particle);
        }

        // Clock
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toTimeString().split(' ')[0];
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Get user name from storage
        const userName = sessionStorage.getItem('enigma_userName') || localStorage.getItem('enigma_userName') || 'PARTICIPANT';
        document.getElementById('userName').textContent = userName;

        // Render leaderboard
        window.renderWaitingLeaderboard = function(data, topN, roundName) {
            const container = document.getElementById('leaderboard');
            const roundTitle = document.getElementById('roundTitle');
            const subtitle = document.getElementById('subtitle');

            roundTitle.textContent = `${roundName || 'ROUND 1'} COMPLETE`;
            subtitle.textContent = topN ? `TOP ${topN} QUALIFIERS` : 'ALL PARTICIPANTS';

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="no-results">NO DATA AVAILABLE</div>';
                return;
            }
            // Limit to top N
            const displayData = topN ? data.slice(0, topN) : data;
            console.log(JSON.stringify(data));

            container.innerHTML = displayData.map((player, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                const isYou = player.name && player.name.toLowerCase() === userName.toLowerCase();
                const isSelected = topN && rank <= topN;
                
                return `
                    <div class="player-entry ${rankClass} ${isYou ? 'is-you' : ''}" style="animation-delay: ${index * 0.1}s">
                        ${isSelected ? '<div class="selected-badge">QUALIFIED</div>' : ''}
                        <div class="rank">
                            <div class="rank-badge"></div>
                            ${rank}
                        </div>
                        <div class="player-info">
                            <div class="player-name">${player.name || 'ANONYMOUS'}</div>
                            <div class="player-meta">ID: ${(player.id || '').toString().slice(0, 8) || '--------'}</div>
                        </div>
                        <div class="player-score">${player.total_score || player.score || 0}</div>
                    </div>
                `;
            }).join('');
        };

        // Show admin message
        window.showAdminMessage = function(message) {
            const el = document.getElementById('adminMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        };
    })();
    </script>
</body>
</html>
