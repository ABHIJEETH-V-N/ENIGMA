<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Display</title>

    <link rel="preload" href="/assets/codex.js" as="script" />
    <link rel="preload" href="/assets/apple.png" />
    <link rel="preload" href="/assets/bg.jpg" />
    <link rel="preload" href="/assets/cat.png" >
       <link rel="preload" href="/assets/chair.png" />


    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background-color: #f0f2f5;
        color: #1c1e21;
        height: 100vh;
        overflow: hidden;
      }
      #content-container {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        transition: opacity 0.5s ease;
      }
      .kicked-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        color: white;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        text-align: center;
      }
      .kicked-overlay h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        color: #ff4d4d;
      }
    </style>
  </head>
  <body>
    <div id="content-container"></div>
    <div id="kicked" class="kicked-overlay">
      <h1>ACCESS DENIED</h1>
      <p id="reason" style="font-size: 1.2rem"></p>
      <p style="margin-top: 20px; color: #888">
        Contact system administrator for help.
      </p>
    </div>
        <script src="/assets/codex.js"></script>
  </body>
</html>
